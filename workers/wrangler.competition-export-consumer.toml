name = "tohieuquiz-competition-export-consumer"
main = "src/queues/competitionExportQueue.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
minify = true

[[d1_databases]]
binding = "DB"
database_name = "tohieuquiz-db"
database_id = "527fd53b-b69c-4373-9512-b0f23a96c42d"

[[r2_buckets]]
binding = "COMPETITION_EXPORTS"
bucket_name = "tohieuquiz-competition-exports"

[[queues.consumers]]
queue = "tohieuquiz-competition-exports"
max_batch_size = 2
max_batch_timeout = 5
max_retries = 3
retry_delay = 30
