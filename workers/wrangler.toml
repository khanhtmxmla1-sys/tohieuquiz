# TôHiệuQuiz Workers API configuration.
# Resources and production domains belong to the independent TôHiệuQuiz Cloudflare account.

name = "tohieuquiz-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
minify = true

routes = [
    { pattern = "api.thtohieu.com", custom_domain = true }
]

[[services]]
binding = "AI_GATEWAY"
service = "tohieuquiz-ai-gateway"

[secrets]
required = ["JWT_SECRET", "CLIPROXY_TOKEN"]

[[d1_databases]]
binding = "DB"
database_name = "tohieuquiz-db"
database_id = "527fd53b-b69c-4373-9512-b0f23a96c42d"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "OG_IMAGES"
bucket_name = "tohieuquiz-og-images"

[[r2_buckets]]
binding = "CERT_IMAGES"
bucket_name = "tohieuquiz-certificates"

[vars]
CLIPROXY_API = "https://ai-gateway.internal/v1"
R2_PUBLIC_URL = "https://assets.thtohieu.com"
AUTH_MIGRATION_MODE = "enforce"
AUTH_TOKEN_TRANSPORT_MODE = "cookie"
ENVIRONMENT = "production"
ALLOWED_ORIGINS = "https://thtohieu.com,https://www.thtohieu.com,https://app.thtohieu.com,https://phuhuynh.thtohieu.com"
ANNOUNCEMENT_IMAGE_HOSTS = "thtohieu.com,www.thtohieu.com,app.thtohieu.com,assets.thtohieu.com"
PARENT_EMAIL_PROVIDER = "disabled"
PARENT_EMAIL_PUBLIC_BASE_URL = "https://phuhuynh.thtohieu.com"
PARENT_EMAIL_SPF_READY = "false"
PARENT_EMAIL_DKIM_READY = "false"
PARENT_EMAIL_DMARC_READY = "false"

[triggers]
crons = [
    "0 0 * * 1",
    "* * * * *",
    "0 23 * * *",
    "0 * * * *"
]

[[queues.producers]]
binding = "CERTIFICATE_QUEUE"
queue = "tohieuquiz-certificate-generation"
