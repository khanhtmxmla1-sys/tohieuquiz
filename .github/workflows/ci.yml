name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.22.0

jobs:
  typecheck:
    name: Type check (frontend + workers)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Install worker dependencies
        run: npm ci --prefix workers --ignore-scripts

      - name: Type check frontend
        run: npx tsc --noEmit

      - name: Type check workers
        run: npx tsc -p workers/tsconfig.json --noEmit

  test:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run Vitest
        run: npm run test:run

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Build frontend
        run: npm run build
        env:
          # Mirrors the production Vercel configuration: every rollout flag stays
          # off by default so the build proves the shipped configuration compiles.
          SITEMAP_SITE_URL: https://www.thtohieu.com
          VITE_FEATURE_GIFT_SHOP_V2: 'false'
          VITE_FEATURE_AI_QUIZ_V2: 'false'
          VITE_FEATURE_AI_BLUEPRINT_V3: 'false'
          VITE_FEATURE_PARENT_PORTAL_V1: 'false'
          VITE_GIFT_SHOP_MODE: api

      - name: Verify no placeholder host leaked into the bundle
        run: |
          if grep -rIl --exclude-dir=node_modules '\.invalid' dist; then
            echo "::error::Placeholder '.invalid' host found in the production bundle."
            exit 1
          fi
          echo "No placeholder hosts in the bundle."

  e2e:
    name: Cypress end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # E2E is the slowest gate and every spec stubs its own API traffic, so it runs
    # on pull requests and on main rather than on every feature-branch push.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      # Pass 1 — every stubbed spec with Blueprint V3 OFF.
      # ai-quiz-generation-v2 asserts the V2 pipeline (OCR → GENERATE → REPAIR →
      # REVIEW), which V3 replaces, so the two AI specs cannot share one pass.
      # See docs/testing/e2e.md.
      - name: Cypress — stubbed specs (Blueprint V3 off)
        uses: cypress-io/github-action@v6
        with:
          install: false
          start: npm run dev
          wait-on: http://localhost:3001
          wait-on-timeout: 120
          browser: chrome
          command: npm run cypress:run:stubbed
        env:
          VITE_FEATURE_GIFT_SHOP_V2: 'true'
          VITE_FEATURE_AI_QUIZ_V2: 'true'
          VITE_FEATURE_AI_BLUEPRINT_V3: 'false'
          VITE_FEATURE_PARENT_PORTAL_V1: 'true'
          VITE_GIFT_SHOP_MODE: api

      # Pass 2 — the Blueprint V3 spec with its own flag on.
      - name: Cypress — Blueprint V3 spec (Blueprint V3 on)
        uses: cypress-io/github-action@v6
        with:
          install: false
          start: npm run dev
          wait-on: http://localhost:3001
          wait-on-timeout: 120
          browser: chrome
          command: npm run cypress:run:blueprint-v3
        env:
          VITE_FEATURE_GIFT_SHOP_V2: 'true'
          VITE_FEATURE_AI_QUIZ_V2: 'true'
          VITE_FEATURE_AI_BLUEPRINT_V3: 'true'
          VITE_FEATURE_PARENT_PORTAL_V1: 'true'
          VITE_GIFT_SHOP_MODE: api

      # student-dashboard-responsive.cy.ts and student-practice-library.cy.ts are
      # deliberately excluded: they log in for real and need
      # --env studentUsername=...,studentPassword=... against a deployed
      # environment. quiz.cy.ts is quarantined (see its file header).

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
          retention-days: 7
