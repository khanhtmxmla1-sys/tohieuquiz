name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.22.0

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Lint source and tests
        run: npm run lint

  typecheck:
    name: Type check (frontend + workers)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Install worker dependencies
        run: npm ci --prefix workers --ignore-scripts

      - name: Type check frontend
        run: npm run typecheck

      - name: Type check strict schema and utility lane
        run: npm run typecheck:strict

      - name: Type check workers
        run: npm run typecheck:workers

  test:
    name: Vitest shard ${{ matrix.shard }}/2
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Install worker dependencies
        run: npm ci --prefix workers --ignore-scripts

      - name: Run Vitest shard
        run: npm run test:ci:shard -- --shard=${{ matrix.shard }}/2 --reporter=dot

  coverage:
    name: Coverage threshold
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run coverage threshold
        run: npm run test:coverage

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Build frontend
        run: npm run build
        env:
          # Mirrors the production Vercel configuration: every rollout flag stays
          # off by default so the build proves the shipped configuration compiles.
          SITEMAP_SITE_URL: https://www.thtohieu.com
          VITE_FEATURE_GIFT_SHOP_V2: 'false'
          VITE_FEATURE_AI_QUIZ_V2: 'false'
          VITE_FEATURE_AI_BLUEPRINT_V3: 'false'
          VITE_FEATURE_AI_SVG_DIAGRAMS: 'false'
          VITE_FEATURE_PARENT_PORTAL_V1: 'false'
          VITE_GIFT_SHOP_MODE: api

      - name: Enforce performance budget
        run: npm run perf:budget

      - name: Verify no placeholder host leaked into the bundle
        run: |
          node scripts/check-placeholder-hosts.mjs dist

  # E2E runs as THREE jobs, not several steps in one job.
  #
  # Why three: `ai-quiz-generation-v2.cy.ts` asserts the V2 pipeline
  # (OCR → GENERATE → REPAIR → REVIEW), Blueprint V3 replaces it, and SVG diagrams
  # need V2 + V3 + SVG enabled together. See docs/testing/e2e.md.
  #
  # Why separate jobs rather than two steps: cypress-io/github-action leaves its
  # `start` server running, so a second step finds port 3001 occupied, Vite silently
  # moves to another port, and Cypress then talks to the *previous* server (built with
  # the wrong flag) until it dies. Separate runners make the isolation real.
  #
  # student-dashboard-responsive.cy.ts and student-practice-library.cy.ts are excluded
  # from both: they log in for real and need --env studentUsername=...,studentPassword=...
  # against a deployed environment. quiz.cy.ts is quarantined (see its file header).
  e2e-stubbed:
    name: Cypress — stubbed specs (Blueprint V3 off)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Pull requests run the fast E2E gate. Main is covered by Release readiness,
    # so the same Cypress suite is not billed twice for the merged commit.
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run stubbed specs
        uses: cypress-io/github-action@v7
        with:
          install: false
          start: npm run dev
          wait-on: http://localhost:3001
          wait-on-timeout: 120
          command: npm run cypress:run:stubbed
        env:
          VITE_FEATURE_GIFT_SHOP_V2: 'true'
          VITE_FEATURE_AI_QUIZ_V2: 'true'
          VITE_FEATURE_AI_BLUEPRINT_V3: 'false'
          VITE_FEATURE_AI_SVG_DIAGRAMS: 'false'
          VITE_FEATURE_PARENT_PORTAL_V1: 'true'
          VITE_GIFT_SHOP_MODE: api

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-screenshots-stubbed
          path: cypress/screenshots
          if-no-files-found: ignore
          retention-days: 7

  e2e-blueprint-v3:
    name: Cypress — Blueprint V3 spec (Blueprint V3 on)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run Blueprint V3 spec
        uses: cypress-io/github-action@v7
        with:
          install: false
          start: npm run dev
          wait-on: http://localhost:3001
          wait-on-timeout: 120
          command: npm run cypress:run:blueprint-v3
        env:
          VITE_FEATURE_GIFT_SHOP_V2: 'true'
          VITE_FEATURE_AI_QUIZ_V2: 'true'
          VITE_FEATURE_AI_BLUEPRINT_V3: 'true'
          VITE_FEATURE_AI_SVG_DIAGRAMS: 'false'
          VITE_FEATURE_PARENT_PORTAL_V1: 'true'
          VITE_GIFT_SHOP_MODE: api

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-screenshots-blueprint-v3
          path: cypress/screenshots
          if-no-files-found: ignore
          retention-days: 7

  e2e-svg-diagrams:
    name: Cypress — AI SVG diagrams (all AI flags on)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run AI SVG diagram spec
        uses: cypress-io/github-action@v7
        with:
          install: false
          start: npm run dev
          wait-on: http://localhost:3001
          wait-on-timeout: 120
          command: npm run cypress:run:svg-diagrams
        env:
          VITE_FEATURE_GIFT_SHOP_V2: 'true'
          VITE_FEATURE_AI_QUIZ_V2: 'true'
          VITE_FEATURE_AI_BLUEPRINT_V3: 'true'
          VITE_FEATURE_AI_SVG_DIAGRAMS: 'true'
          VITE_FEATURE_PARENT_PORTAL_V1: 'true'
          VITE_GIFT_SHOP_MODE: api

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-screenshots-svg-diagrams
          path: cypress/screenshots
          if-no-files-found: ignore
          retention-days: 7
