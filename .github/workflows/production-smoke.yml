name: Production smoke and staged rollout

on:
  workflow_dispatch:
    inputs:
      action:
        description: Read-only smoke or staged rollout operation
        required: true
        type: choice
        default: smoke
        options:
          - smoke
          - rollout-plan
          - rollout-apply
          - rollout-evaluate
          - rollout-rollback
      ai_smoke:
        description: Run read-only AI rollout readiness checks
        required: true
        type: boolean
        default: false
      mutation_namespace:
        description: Queue/certificate mutations are disabled here; only staging/test are valid namespaces
        required: true
        type: choice
        default: none
        options:
          - none
          - staging
          - test
      flag_key:
        description: Runtime feature flag key
        required: true
        default: unified_notifications_v1
      rollout_stage:
        description: Current or target rollout stage
        required: true
        type: choice
        default: admin-only
        options:
          - admin-only
          - teachers-5
          - pilot-class
          - teachers-25
          - full
      pilot_class_id:
        description: Required only for the pilot-class stage
        required: false
      rollout_reason:
        description: Required audit reason for apply or rollback
        required: false
        default: GitHub Actions staged rollout
      observation_started_at:
        description: ISO timestamp when the current observation window began
        required: false
      error_5xx_rate_percent:
        description: Current 5xx rate percent
        required: false
        default: '0'
      baseline_client_error_rate:
        description: Baseline client error rate
        required: false
        default: '0'
      client_error_rate:
        description: Current client error rate
        required: false
        default: '0'
      baseline_p95_ms:
        description: Baseline p95 latency in milliseconds
        required: false
        default: '0'
      p95_ms:
        description: Current p95 latency in milliseconds
        required: false
        default: '0'
      data_corruption:
        description: Data-corruption signal detected
        required: true
        type: boolean
        default: false
      auth_anomaly:
        description: Authentication anomaly detected
        required: true
        type: boolean
        default: false
      auto_rollback:
        description: Roll back to the previous stage when evaluation is blocked
        required: true
        type: boolean
        default: false
  deployment_status:

permissions:
  contents: read

concurrency:
  group: production-smoke-${{ github.event_name == 'deployment_status' && 'deployment-status' || inputs.action == 'smoke' && 'smoke' || 'rollout' }}
  # Supersede stale smoke checks, but never cancel a manual rollout mutation.
  cancel-in-progress: ${{ github.event_name == 'deployment_status' || inputs.action == 'smoke' }}

jobs:
  smoke:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       inputs.action == 'smoke' &&
       github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-smoke
    env:
      NODE_VERSION: 22.22.0
      SITE_URL: https://www.thtohieu.com
      APEX_URL: https://thtohieu.com
      API_URL: https://api.thtohieu.com
      PARENT_URL: https://phuhuynh.thtohieu.com
      AI_SMOKE: ${{ inputs.ai_smoke || 'false' }}
      MUTATION_NAMESPACE: ${{ inputs.mutation_namespace || 'none' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run read-only production smoke
        shell: bash
        env:
          SMOKE_ADMIN_USERNAME: ${{ secrets.SMOKE_ADMIN_USERNAME }}
          SMOKE_ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
          SMOKE_TEACHER_USERNAME: ${{ secrets.SMOKE_TEACHER_USERNAME }}
          SMOKE_TEACHER_PASSWORD: ${{ secrets.SMOKE_TEACHER_PASSWORD }}
          SMOKE_STUDENT_USERNAME: ${{ secrets.SMOKE_STUDENT_USERNAME }}
          SMOKE_STUDENT_PASSWORD: ${{ secrets.SMOKE_STUDENT_PASSWORD }}
          SMOKE_PARENT_ACCESS_CODE: ${{ secrets.SMOKE_PARENT_ACCESS_CODE }}
          SMOKE_PARENT_PIN: ${{ secrets.SMOKE_PARENT_PIN }}
        run: |
          args=(
            --site "$SITE_URL"
            --apex "$APEX_URL"
            --api "$API_URL"
            --parent "$PARENT_URL"
            --production-targets
            --skip-browser
            --mutation-namespace "$MUTATION_NAMESPACE"
            --output reports/production-smoke.json
          )
          if [[ "$AI_SMOKE" == "true" ]]; then
            args+=(--ai-smoke)
          fi
          node scripts/run-production-smoke.mjs "${args[@]}"

      - name: Upload redacted smoke report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-smoke-report-${{ github.run_id }}
          path: reports/production-smoke.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload public-page failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: production-smoke-public-screenshots-${{ github.run_id }}
          path: cypress/screenshots
          if-no-files-found: ignore
          retention-days: 7

  public-smoke:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       inputs.action == 'smoke' &&
       github.ref == 'refs/heads/main') ||
      (github.event_name == 'deployment_status' &&
       github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_VERSION: 22.22.0
      SITE_URL: https://www.thtohieu.com
      APEX_URL: https://thtohieu.com
      API_URL: https://api.thtohieu.com
      PARENT_URL: https://phuhuynh.thtohieu.com
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: refs/heads/main

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked dependencies and Cypress binary
        run: npm ci

      - name: Run public-only production smoke without secrets
        shell: bash
        run: >-
          node scripts/run-production-smoke.mjs
          --site "$SITE_URL"
          --apex "$APEX_URL"
          --api "$API_URL"
          --parent "$PARENT_URL"
          --production-targets
          --public-only
          --skip-browser
          --output reports/production-public-smoke.json

      - name: Run public browser smoke without secrets
        shell: bash
        run: >-
          npx cypress run --e2e
          --spec cypress/e2e/production-smoke.cy.ts
          --config baseUrl="$SITE_URL"
          --env apexBaseUrl="$APEX_URL",apiBaseUrl="$API_URL",parentBaseUrl="$PARENT_URL"

      - name: Upload public-page failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: production-public-smoke-screenshots-${{ github.run_id }}
          path: cypress/screenshots
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload public smoke report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-public-smoke-report-${{ github.run_id }}
          path: reports/production-public-smoke.json
          if-no-files-found: error
          retention-days: 14

  rollout-readonly:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.action == 'rollout-plan' ||
       (inputs.action == 'rollout-evaluate' && inputs.auto_rollback == false))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_VERSION: 22.22.0
      ACTION_INPUT: ${{ inputs.action }}
      SITE_URL: https://www.thtohieu.com
      API_URL: https://api.thtohieu.com
      FLAG_KEY: ${{ inputs.flag_key }}
      ROLLOUT_STAGE: ${{ inputs.rollout_stage }}
      PILOT_CLASS_ID: ${{ inputs.pilot_class_id }}
      ROLLOUT_REASON: ${{ inputs.rollout_reason }}
      OBSERVATION_STARTED_AT: ${{ inputs.observation_started_at }}
      AUTO_ROLLBACK: ${{ inputs.auto_rollback }}
      ERROR_5XX_RATE_PERCENT: ${{ inputs.error_5xx_rate_percent }}
      BASELINE_CLIENT_ERROR_RATE: ${{ inputs.baseline_client_error_rate }}
      CLIENT_ERROR_RATE: ${{ inputs.client_error_rate }}
      BASELINE_P95_MS: ${{ inputs.baseline_p95_ms }}
      P95_MS: ${{ inputs.p95_ms }}
      DATA_CORRUPTION: ${{ inputs.data_corruption }}
      AUTH_ANOMALY: ${{ inputs.auth_anomaly }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: refs/heads/main

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Build rollout metrics input
        if: inputs.action == 'rollout-evaluate'
        shell: bash
        run: |
          mkdir -p reports
          node <<'NODE'
          const fs = require('node:fs');
          const number = (name) => Number(process.env[name] || 0);
          const boolean = (name) => String(process.env[name] || '').toLowerCase() === 'true';
          const metrics = {
            error5xxRatePercent: number('ERROR_5XX_RATE_PERCENT'),
            baselineClientErrorRate: number('BASELINE_CLIENT_ERROR_RATE'),
            clientErrorRate: number('CLIENT_ERROR_RATE'),
            baselineP95Ms: number('BASELINE_P95_MS'),
            p95Ms: number('P95_MS'),
            dataCorruption: boolean('DATA_CORRUPTION'),
            authAnomaly: boolean('AUTH_ANOMALY'),
          };
          fs.writeFileSync('reports/rollout-metrics.json', `${JSON.stringify(metrics, null, 2)}\n`, 'utf8');
          NODE

      - name: Plan, apply, evaluate, or roll back rollout
        shell: bash
        run: |
          action="${ACTION_INPUT#rollout-}"
          args=(
            --action "$action"
            --site "$SITE_URL"
            --api "$API_URL"
            --production-targets
            --flag "$FLAG_KEY"
            --stage "$ROLLOUT_STAGE"
            --reason "$ROLLOUT_REASON"
            --output reports/staged-rollout.json
          )
          if [[ -n "$PILOT_CLASS_ID" ]]; then
            args+=(--pilot-class "$PILOT_CLASS_ID")
          fi
          if [[ "$action" == "evaluate" ]]; then
            args+=(--metrics reports/rollout-metrics.json --observation-started-at "$OBSERVATION_STARTED_AT")
            if [[ "$AUTO_ROLLBACK" == "true" ]]; then
              args+=(--auto-rollback)
            fi
          fi
          node scripts/run-staged-rollout.mjs "${args[@]}"

      - name: Upload redacted rollout report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: staged-rollout-report-${{ github.run_id }}
          path: reports/staged-rollout.json
          if-no-files-found: error
          retention-days: 14

  rollout-write:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      vars.PRODUCTION_ROLLOUT_ENABLED == 'true' &&
      (inputs.action == 'rollout-apply' ||
       inputs.action == 'rollout-rollback' ||
       (inputs.action == 'rollout-evaluate' && inputs.auto_rollback == true))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-rollout
    env:
      NODE_VERSION: 22.22.0
      ACTION_INPUT: ${{ inputs.action }}
      SITE_URL: https://www.thtohieu.com
      API_URL: https://api.thtohieu.com
      FLAG_KEY: ${{ inputs.flag_key }}
      ROLLOUT_STAGE: ${{ inputs.rollout_stage }}
      PILOT_CLASS_ID: ${{ inputs.pilot_class_id }}
      ROLLOUT_REASON: ${{ inputs.rollout_reason }}
      OBSERVATION_STARTED_AT: ${{ inputs.observation_started_at }}
      AUTO_ROLLBACK: ${{ inputs.auto_rollback }}
      ERROR_5XX_RATE_PERCENT: ${{ inputs.error_5xx_rate_percent }}
      BASELINE_CLIENT_ERROR_RATE: ${{ inputs.baseline_client_error_rate }}
      CLIENT_ERROR_RATE: ${{ inputs.client_error_rate }}
      BASELINE_P95_MS: ${{ inputs.baseline_p95_ms }}
      P95_MS: ${{ inputs.p95_ms }}
      DATA_CORRUPTION: ${{ inputs.data_corruption }}
      AUTH_ANOMALY: ${{ inputs.auth_anomaly }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Build rollout metrics input
        if: inputs.action == 'rollout-evaluate'
        shell: bash
        run: |
          mkdir -p reports
          node <<'NODE'
          const fs = require('node:fs');
          const number = (name) => Number(process.env[name] || 0);
          const boolean = (name) => String(process.env[name] || '').toLowerCase() === 'true';
          const metrics = {
            error5xxRatePercent: number('ERROR_5XX_RATE_PERCENT'),
            baselineClientErrorRate: number('BASELINE_CLIENT_ERROR_RATE'),
            clientErrorRate: number('CLIENT_ERROR_RATE'),
            baselineP95Ms: number('BASELINE_P95_MS'),
            p95Ms: number('P95_MS'),
            dataCorruption: boolean('DATA_CORRUPTION'),
            authAnomaly: boolean('AUTH_ANOMALY'),
          };
          fs.writeFileSync('reports/rollout-metrics.json', `${JSON.stringify(metrics, null, 2)}\n`, 'utf8');
          NODE

      - name: Apply, evaluate, or roll back rollout with protected approval
        shell: bash
        env:
          SMOKE_ADMIN_USERNAME: ${{ secrets.SMOKE_ADMIN_USERNAME }}
          SMOKE_ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
        run: |
          action="${ACTION_INPUT#rollout-}"
          args=(
            --action "$action"
            --site "$SITE_URL"
            --api "$API_URL"
            --production-targets
            --flag "$FLAG_KEY"
            --stage "$ROLLOUT_STAGE"
            --reason "$ROLLOUT_REASON"
            --output reports/staged-rollout.json
          )
          if [[ -n "$PILOT_CLASS_ID" ]]; then
            args+=(--pilot-class "$PILOT_CLASS_ID")
          fi
          if [[ "$action" == "evaluate" ]]; then
            args+=(--metrics reports/rollout-metrics.json --observation-started-at "$OBSERVATION_STARTED_AT")
            if [[ "$AUTO_ROLLBACK" == "true" ]]; then
              args+=(--auto-rollback)
            fi
          fi
          node scripts/run-staged-rollout.mjs "${args[@]}"

      - name: Upload redacted rollout report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: staged-rollout-write-report-${{ github.run_id }}
          path: reports/staged-rollout.json
          if-no-files-found: error
          retention-days: 14

  rollout-write-blocked:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.action == 'rollout-apply' ||
       inputs.action == 'rollout-rollback' ||
       (inputs.action == 'rollout-evaluate' && inputs.auto_rollback == true)) &&
      (github.ref != 'refs/heads/main' || vars.PRODUCTION_ROLLOUT_ENABLED != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail closed with write prerequisites
        shell: bash
        run: |
          echo "Production rollout writes are disabled: dispatch from refs/heads/main with PRODUCTION_ROLLOUT_ENABLED=true and an approved production-rollout environment."
          exit 1
