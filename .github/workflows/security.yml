name: Security checks

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install locked frontend dependencies
        run: npm ci --ignore-scripts

      - name: Install locked Worker dependencies
        run: npm ci --prefix workers --ignore-scripts

      - name: Scan repository for secrets and sensitive exports
        run: npm run security:scan

      - name: Scan reachable Git history
        run: npm run security:history

      - name: Enforce browser and API security policies
        run: npm run security:policies

      - name: Audit frontend and Worker production dependencies
        run: npm run audit:dependencies:all:enforce
