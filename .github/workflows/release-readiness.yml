name: Release readiness

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:
    inputs:
      base_ref:
        description: Git reference used to compare migrations and release changes
        required: true
        default: origin/main
        type: string

permissions:
  contents: read

concurrency:
  group: release-readiness-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.22.0

jobs:
  core-gate:
    name: Core readiness gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SITEMAP_SITE_URL: https://www.thtohieu.com
      VITE_FEATURE_GIFT_SHOP_V2: 'false'
      VITE_FEATURE_AI_QUIZ_V2: 'false'
      VITE_FEATURE_AI_BLUEPRINT_V3: 'false'
      VITE_FEATURE_PARENT_PORTAL_V1: 'false'
      VITE_GIFT_SHOP_MODE: api
      RELEASE_BASE_REF: ${{ inputs.base_ref || github.event.pull_request.base.sha || 'origin/main' }}
    steps:
      - name: Checkout candidate commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked frontend dependencies
        run: npm ci --ignore-scripts

      - name: Install locked Worker dependencies
        run: npm ci --prefix workers --ignore-scripts

      - name: Run full verification
        run: npm run verify

      - name: Enforce performance budget
        run: npm run perf:budget

      - name: Verify migration and rollback contracts
        run: npm run test:run -- tests/d1MigrationLayout.test.ts tests/d1RollbackCoverage.test.ts tests/freshD1Bootstrap.test.ts

      - name: Write release-readiness policy report
        run: npm run release:readiness -- --base="$RELEASE_BASE_REF" --output=reports/release-readiness-policy.json

      - name: Upload policy report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-readiness-policy-${{ github.run_id }}
          path: reports/release-readiness-policy.json
          if-no-files-found: ignore
          retention-days: 14

  e2e-stubbed:
    name: Cypress stubbed readiness
    needs: core-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candidate commit
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run stubbed Cypress specs
        uses: cypress-io/github-action@v6
        with:
          install: false
          start: npm run dev
          wait-on: http://localhost:3001
          wait-on-timeout: 120
          command: npm run cypress:run:stubbed
        env:
          VITE_FEATURE_GIFT_SHOP_V2: 'true'
          VITE_FEATURE_AI_QUIZ_V2: 'true'
          VITE_FEATURE_AI_BLUEPRINT_V3: 'false'
          VITE_FEATURE_PARENT_PORTAL_V1: 'true'
          VITE_GIFT_SHOP_MODE: api

      - name: Upload stubbed failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-readiness-cypress-stubbed-${{ github.run_id }}
          path: cypress/screenshots
          if-no-files-found: ignore
          retention-days: 7

  e2e-blueprint-v3:
    name: Cypress Blueprint V3 readiness
    needs: core-gate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout candidate commit
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run Blueprint V3 Cypress spec
        uses: cypress-io/github-action@v6
        with:
          install: false
          start: npm run dev
          wait-on: http://localhost:3001
          wait-on-timeout: 120
          command: npm run cypress:run:blueprint-v3
        env:
          VITE_FEATURE_GIFT_SHOP_V2: 'true'
          VITE_FEATURE_AI_QUIZ_V2: 'true'
          VITE_FEATURE_AI_BLUEPRINT_V3: 'true'
          VITE_FEATURE_PARENT_PORTAL_V1: 'true'
          VITE_GIFT_SHOP_MODE: api

      - name: Upload Blueprint V3 failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-readiness-cypress-blueprint-v3-${{ github.run_id }}
          path: cypress/screenshots
          if-no-files-found: ignore
          retention-days: 7

  release-ready:
    name: Release ready
    needs: [core-gate, e2e-stubbed, e2e-blueprint-v3]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write aggregate readiness report
        env:
          CORE_RESULT: ${{ needs.core-gate.result }}
          E2E_V2_RESULT: ${{ needs.e2e-stubbed.result }}
          E2E_V3_RESULT: ${{ needs.e2e-blueprint-v3.result }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          mkdir -p reports
          node <<'NODE'
          const fs = require('node:fs');
          const checks = {
            coreGate: process.env.CORE_RESULT,
            cypressV2: process.env.E2E_V2_RESULT,
            cypressV3: process.env.E2E_V3_RESULT,
          };
          const status = Object.values(checks).every(value => value === 'success')
            ? 'ready'
            : 'blocked';
          const report = {
            status,
            releaseSha: process.env.RELEASE_SHA,
            checks,
          };
          fs.writeFileSync(
            'reports/release-readiness.json',
            `${JSON.stringify(report, null, 2)}\n`,
            'utf8',
          );
          process.stdout.write(`${JSON.stringify(report)}\n`);
          NODE

      - name: Upload aggregate readiness report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-readiness-${{ github.run_id }}
          path: reports/release-readiness.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce ready status
        run: |
          node -e "const r=require('./reports/release-readiness.json'); if(r.status!=='ready') process.exit(1)"
